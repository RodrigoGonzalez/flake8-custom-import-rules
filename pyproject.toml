[project]
name = "flake8_custom_import_rules"
version = "4.0.0"
description = "A Flake8 plugin that enforces custom import rules, allowing users to define and maintain clean and consistent import organization across their Python projects."
readme = "README.rst"
requires-python = ">=3.10,<4"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Rodrigo Gonzalez", email = "flake8.custom.import.rules@gmail.com" },
]
keywords = [
    "code_quality",
    "code_linting",
    "import_rules",
    "flake8",
    "quality_assurance",
]
classifiers = [
    "Framework :: Flake8",
    "Environment :: Console",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "attrs",
    "flake8",
]



[project.scripts]
import-rules = "flake8_custom_import_rules.__main__:main"



[project.entry-points."flake8.extension"]
CIR = "flake8_custom_import_rules.flake8_plugin:Plugin"



[project.urls]
Homepage = "https://github.com/RodrigoGonzalez/flake8-custom-import-rules"
Repository = "https://github.com/RodrigoGonzalez/flake8-custom-import-rules"
GitHub = "https://github.com/RodrigoGonzalez/flake8-custom-import-rules"
Documentation = "https://RodrigoGonzalez.github.io/flake8-custom-import-rules/"
"Change Log" = "https://github.com/RodrigoGonzalez/flake8-custom-import-rules/blob/main/CHANGELOG.md"



# =============================================================================
# DEPENDENCY GROUPS
# =============================================================================

[dependency-groups]
dev = [
    # AST inspection is part of the normal development workflow for this
    # AST/visitor-heavy Flake8 extension.
    "astpretty",

    # IPython 9 requires Python >=3.11. Keep the latest Python-3.10-compatible
    # release line for the minimum supported interpreter.
    "ipython; python_version < '3.11'",
    "ipython; python_version >= '3.11'",

    # Repository and development tooling.
    "commitizen",
    "pre-commit",
    "isort",
    "black",
    "autoflake",
    "mypy",

    # Repository lint tooling. Pylama is not a runtime dependency of the
    # installed Flake8 plugin.
    "pylama",

    # Developer dependency-graph inspection used by
    # scripts/gen_modules_graph.py.
    "modulegraph",

    # Required by the Makefile README validation target.
    "docutils",
]

test = [
    "covdefaults",
    "coverage[toml]",

    # Cython is required in the test environment so Cython.Coverage can
    # measure the compiled extension modules.
    "Cython",

    # Local fixture repository used by the test suite.
    "my-base-module",

    # Tests interact with pycodestyle directly. Flake8 owns pycodestyle as a
    # runtime transitive dependency, so it does not need to be duplicated in
    # [project].dependencies.
    "pycodestyle",

    "pytest",
    "pytest-cov",
    "pytest-mock",

    # tox-uv consumes uv.lock and PEP 735 dependency groups directly.
    "tox",
    "tox-uv",
]

docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
    "pymdown-extensions",
]



# =============================================================================
# UV
# =============================================================================

[tool.uv]
required-version = ">=0.12.16,<0.13"



[tool.uv.sources]
my-base-module = { path = "example_repos/my_base_module", editable = true }



# =============================================================================
# COMMITIZEN
# =============================================================================

[tool.commitizen]
name = "cz_conventional_commits"

# uv owns the version in [project] and the project version recorded in uv.lock.
version_provider = "uv"
version_scheme = "pep440"

tag_format = "v$version"

# CHANGELOG.md is maintained deliberately by the project rather than generated
# as a side effect of a Commitizen version bump.
update_changelog_on_bump = false

# pyproject.toml and uv.lock are handled by the uv version provider.
# The source-level __version__ value must remain synchronized separately.
version_files = [
    "src/flake8_custom_import_rules/__init__.py:__version__",
]



# =============================================================================
# ISORT
# =============================================================================

[tool.isort]
profile = "black"
skip_glob = ["docs", "example_repos"]
line_length = 100
multi_line_output = 4
force_single_line = true
src_paths = ["src", "tests", "scripts"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
known_first_party = ["flake8_custom_import_rules", "my_base_module"]
known_third_party = ["flake8"]



# =============================================================================
# BLACK
# =============================================================================

[tool.black]
line-length = 100
target-version = [
    "py310",
    "py311",
    "py312",
    "py313",
    "py314",
]
include = '\.pyi?$'
exclude = '''
    /(
        \.git
      | \.mypy_cache
      | \.mypy_html_report
      | \.venv
      | _build
      | build
      | dist
      | docs
      | example_repos
    )/
'''



# =============================================================================
# MYPY
# =============================================================================

[tool.mypy]
# output
show_error_codes = true
show_column_numbers = true
show_error_context = true
show_traceback = true

# 3rd party import
ignore_missing_imports = true

# dynamic typing
disallow_any_unimported = false
disallow_any_expr = false
disallow_any_decorated = false
disallow_any_explicit = false
disallow_any_generics = false
disallow_subclassing_any = false

# platform
# Type checking targets the minimum supported Python version so source code
# remains valid throughout the full Python 3.10-3.14 support window.
python_version = "3.10"

# untyped
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true

# None and Optional
no_implicit_optional = true

# strictness
explicit_package_bases = true

# Warnings
warn_return_any = false
warn_unreachable = true

# Misc
pretty = true
exclude = [
    "example_repos",
    "tests",
]



# =============================================================================
# COVERAGE
# =============================================================================

[tool.coverage.run]
plugins = [
    "covdefaults",
    "Cython.Coverage",
]
omit = ["flake8_custom_import_rules/example_repos/*"]



# =============================================================================
# TRYCERATOPS — CURRENTLY DISABLED
# =============================================================================

# Tryceratops is intentionally not part of the active dependency set.
#
# Preserve the corresponding pre-commit hook as commented-out configuration so
# the tool can be re-enabled later without reconstructing the previous setup.
#
# If Tryceratops is re-enabled in the future, add it back to the dev dependency
# group and uncomment the configuration below.
#
# [tool.tryceratops]
# exclude = ["flake8_custom_import_rules/example_repos/", "scripts/*"]
# experimental = false
# check_pickable = false



# =============================================================================
# SETUPTOOLS
# =============================================================================

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true



[tool.setuptools.packages.find]
where = ["src"]
include = ["flake8_custom_import_rules*"]
namespaces = false



# The package advertises "Typing :: Typed", so ship the PEP 561 marker.
[tool.setuptools.package-data]
flake8_custom_import_rules = ["py.typed"]



# =============================================================================
# TOX
# =============================================================================

# tox uses the same uv.lock and PEP 735 test dependency group as the rest of
# the project. The old Poetry-based tox.ini is no longer authoritative.
[tool.tox]
requires = [
    "tox",
    "tox-uv",
]
env_list = [
    "3.10",
    "3.11",
    "3.12",
    "3.13",
    "3.14",
]



# The test environment and commands.
[tool.tox.env_run_base]
description = "Run coverage under Python {base_python}"
runner = "uv-venv-lock-runner"

# Install the project in editable form so the Cython extensions are compiled
# from the current checkout for every supported interpreter.
package = "editable"

# Install only the explicitly selected test group in addition to the project
# and its runtime dependencies. Do not implicitly install the dev group.
dependency_groups = ["test"]
no_default_groups = true

# tox-uv normally supplies --locked automatically. Keep this explicit because
# reproducibility against the committed uv.lock is part of the test contract.
uv_sync_locked = true

set_env = { PY_IGNORE_IMPORTMISMATCH = "1" }

commands = [
    [
        "python",
        "-m",
        "pytest",
        "-vvvvsra",
        "--doctest-modules",
        "--cov=src",
        "--cov-report=term-missing",
        "--cov-report=xml",
        "--cov-fail-under=80",
        "--junitxml=pytest.xml",
    ],
]



# =============================================================================
# BUILD SYSTEM
# =============================================================================

[build-system]
requires = [
    "setuptools",
    "Cython",
]
build-backend = "setuptools.build_meta"