[project]
name = "flake8_custom_import_rules"
version = "3.0.0"
description = "A Flake8 plugin that enforces custom import rules, allowing users to define and maintain clean and consistent import organization across their Python projects."
readme = "README.rst"
requires-python = ">=3.9,<4"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Rodrigo Gonzalez", email = "flake8.custom.import.rules@gmail.com" },
]
keywords = [
    "code_quality",
    "code_linting",
    "import_rules",
    "flake8",
    "quality_assurance",
]
classifiers = [
    "Framework :: Flake8",
    "Environment :: Console",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "flake8>=6.1,<8.0",
    "importlib-metadata; python_version < '3.8'",
    "pylama>=8.4.1,<9",
    "stdlib-list>=0.10.0; python_version < '3.10'",
    "pycodestyle>=2.11.1,<3",
    "pymdown-extensions>=10.7,<11",
    "attrs>=24.3,<27",
    "typer>=0.15.1,<0.24",
]

[project.scripts]
import-rules = "flake8_custom_import_rules.__main__:main"

[project.entry-points."flake8.extension"]
CIR = "flake8_custom_import_rules.flake8_plugin:Plugin"

[project.urls]
Homepage = "https://github.com/RodrigoGonzalez/flake8-custom-import-rules"
Repository = "https://github.com/RodrigoGonzalez/flake8-custom-import-rules"
GitHub = "https://github.com/RodrigoGonzalez/flake8-custom-import-rules"
Documentation = "https://RodrigoGonzalez.github.io/flake8-custom-import-rules/"
"Change Log" = "https://github.com/RodrigoGonzalez/flake8-custom-import-rules/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "astpretty>=3.0.0,<4",
    "ipython",
    "commitizen",
    "pre-commit",
    "isort",
    "black",
    "autoflake",
    "mypy",
    "lxml",
    "cmake",
    "tryceratops",
    "tomark",
]
test = [
    "modulegraph>=0.19.6,<0.20",
    "pytest>=8.3.4,<9",
    "pytest-cov>=6,<8",
    "toml>=0.10.2,<0.11",
    "tox>=4.12.1,<5",
    "tox-gh-actions>=3.2.0,<4",
    "coverage[toml]>=7.4.1,<8",
    "covdefaults>=2.3.0,<3",
    "pytest-mock>=3.14.0,<4",
    "my-base-module",
]
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.5.49,<10",
    "mkdocstrings[python]>=0.27,<0.31",
]

[tool.uv]
required-version = ">=0.12.16,<0.13"

[tool.uv.sources]
my-base-module = { path = "example_repos/my_base_module", editable = true }

[tool.commitizen]
name = "cz_conventional_commits"
version = "3.0.0"
tag_format = "v$version"
version_type = "semver"
update_changelog_on_bump = true
version_files = [
    "pyproject.toml:version",
    "src/flake8_custom_import_rules/__init__.py:__version__",
]
changelog_file = "CHANGELOG.md"

[tool.isort]
profile = "black"
skip_glob = ["docs", "example_repos"]
line_length = 100
multi_line_output = 4
force_single_line = true
src_paths = ["src", "tests", "scripts"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
known_first_party = ["flake8_custom_import_rules", "my_base_module"]
known_third_party = ["flake8"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]
include = '\.pyi?$'
exclude = '''
    /(
        \.git
      | \.mypy_cache
      | \.mypy_html_report
      | \.venv
      | _build
      | build
      | dist
      | docs
      | example_repos
    )/
'''

[tool.mypy]
# output
show_error_codes = true
show_column_numbers = true
show_error_context = true
show_traceback = true
# 3rd party import
ignore_missing_imports = true
# dynamic typing
disallow_any_unimported = false
disallow_any_expr = false
disallow_any_decorated = false
disallow_any_explicit = false
disallow_any_generics = false
disallow_subclassing_any = false
# platform
python_version = "3.10"
# untyped
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
# None and Optional
no_implicit_optional = true
# strictness
explicit_package_bases = true
# Warnings
warn_return_any = false
warn_unreachable = true
# Misc
pretty = true
exclude = [
    "example_repos",
    "tests",
]

[tool.coverage.run]
plugins = ["covdefaults"]
omit = ["flake8_custom_import_rules/example_repos/*"]

[tool.tryceratops]
exclude = ["flake8_custom_import_rules/example_repos/", "scripts/*"]
experimental = false
check_pickable = false

[build-system]
requires = ["uv_build>=0.12.16,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["CHANGELOG.md"]
