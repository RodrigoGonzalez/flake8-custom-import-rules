[pytest]
log_cli = false
log_cli_level = INFO
log_cli_format = %(filename)s:%(lineno)03d | %(asctime)s | %(levelname)s | %(funcName)s | %(message)s
# Limit collection to tests so --doctest-modules does not import maintainer
# scripts that require setuptools or modulegraph.
testpaths = tests
# setuptools PEP 660 editable installs use a finder instead of putting the
# example package directory on sys.path. The plugin resolves prefixes from
# sys.path, so the example repo root must be visible during tests.
pythonpath = example_repos/my_base_module
