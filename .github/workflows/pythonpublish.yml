name: Upload Python Package

on:
  workflow_run:
    workflows:
      - "Run Unit Tests"
    types:
      - completed
    branches:
      - main

concurrency:
  group: python-package-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    steps:
    - name: Checkout the tested SHA
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.workflow_run.head_sha }}
        fetch-depth: 0
        fetch-tags: true

    - name: Fetch complete tag history
      run: git fetch --tags --force origin

    - name: Install uv and set the Python version
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        version: "0.12.17"
        python-version: "3.11"
        enable-cache: false

    - name: Classify release state
      id: classify
      env:
        TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python - <<'PY'
        import json
        import os
        import re
        import subprocess
        import sys
        import urllib.error
        import urllib.request
        from pathlib import Path

        tested_sha = os.environ["TESTED_SHA"]
        repo = os.environ.get("GITHUB_REPOSITORY", "")
        gh_token = os.environ.get("GH_TOKEN", "")

        def parse_pyproject_version(path: Path) -> str:
            in_project = False
            for raw_line in path.read_text(encoding="utf-8").splitlines():
                line = raw_line.strip()
                if line.startswith("[") and line.endswith("]"):
                    in_project = line == "[project]"
                    continue
                if in_project:
                    match = re.fullmatch(r'version\s*=\s*["\']([^"\']+)["\']', line)
                    if match:
                        return match.group(1)
            raise SystemExit("could not parse [project].version")

        def parse_stable(version: str):
            match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", version)
            if not match:
                raise SystemExit(
                    f"automatic release requires MAJOR.MINOR.PATCH, got {version!r}"
                )
            return tuple(int(part) for part in match.groups())

        def git(*args: str) -> str:
            return subprocess.check_output(["git", *args], text=True).strip()

        def tag_sha(tag: str) -> str:
            peeled = git("rev-parse", f"{tag}^{{}}")
            return peeled

        def is_ancestor(maybe_ancestor: str, descendant: str) -> bool:
            result = subprocess.run(
                ["git", "merge-base", "--is-ancestor", maybe_ancestor, descendant]
            )
            return result.returncode == 0

        def github_release_exists(tag: str) -> bool:
            url = f"https://api.github.com/repos/{repo}/releases/tags/{tag}"
            request = urllib.request.Request(
                url,
                headers={
                    "Accept": "application/vnd.github+json",
                    "Authorization": f"Bearer {gh_token}",
                    "X-GitHub-Api-Version": "2022-11-28",
                    "User-Agent": "flake8-custom-import-rules-release",
                },
            )
            try:
                with urllib.request.urlopen(request) as response:
                    return 200 <= response.status < 300
            except urllib.error.HTTPError as exc:
                if exc.code == 404:
                    return False
                raise SystemExit(f"GitHub Release lookup failed: {exc}")

        def pypi_has_version(version: str) -> bool:
            url = f"https://pypi.org/pypi/flake8-custom-import-rules/{version}/json"
            request = urllib.request.Request(url, headers={"User-Agent": "flake8-custom-import-rules-release"})
            try:
                with urllib.request.urlopen(request) as response:
                    return 200 <= response.status < 300
            except urllib.error.HTTPError as exc:
                if exc.code == 404:
                    return False
                raise SystemExit(f"PyPI lookup failed: {exc}")

        current_version = parse_pyproject_version(Path("pyproject.toml"))
        current_tuple = parse_stable(current_version)
        current_tag = f"v{current_version}"
        print(f"CURRENT_VERSION={current_version}")
        print(f"CURRENT_TAG={current_tag}")
        print(f"TESTED_SHA={tested_sha}")

        tag_names = [
            line
            for line in git("tag", "-l", "v[0-9]*.[0-9]*.[0-9]*").splitlines()
            if re.fullmatch(r"v\d+\.\d+\.\d+", line)
        ]

        highest = None
        for tag in tag_names:
            sha = tag_sha(tag)

            if not is_ancestor(sha, tested_sha):
                continue

            parsed = parse_stable(tag[1:])

            if highest is None or parsed > highest[0]:
                highest = (parsed, tag)

        current_tag_exists = current_tag in tag_names
        action = None
        reason = ""

        if current_tag_exists:
            existing_sha = tag_sha(current_tag)
            print(f"TAG_SHA={existing_sha}")
            if existing_sha == tested_sha:
                action = "recover"
                reason = "current-version tag exists at tested SHA"
            elif is_ancestor(existing_sha, tested_sha):
                release_ok = github_release_exists(current_tag)
                pypi_ok = pypi_has_version(current_version)
                print(f"github_release_exists={release_ok}")
                print(f"pypi_has_version={pypi_ok}")
                if release_ok and pypi_ok:
                    action = "noop"
                    reason = "current version already released from ancestor"
                else:
                    raise SystemExit(
                        f"release {current_tag} is partially completed at {existing_sha}"
                    )
            else:
                raise SystemExit(
                    f"tag {current_tag} points at unrelated SHA {existing_sha}"
                )
        else:
            if highest is None:
                action = "release"
                reason = "no prior reachable stable release tag"
            elif current_tuple > highest[0]:
                action = "release"
                reason = f"source {current_version} > {highest[1]}"
            else:
                raise SystemExit(
                    "CURRENT_VERSION <= highest released version and CURRENT_TAG does not exist"
                )

            pypi_ok = pypi_has_version(current_version)
            release_ok = github_release_exists(current_tag)
            print(f"github_release_exists={release_ok}")
            print(f"pypi_has_version={pypi_ok}")
            if pypi_ok:
                raise SystemExit(
                    f"CURRENT_TAG {current_tag} is absent but PyPI already "
                    f"contains {current_version}"
                )
            if release_ok:
                raise SystemExit(
                    f"CURRENT_TAG {current_tag} is absent but GitHub Release "
                    f"{current_tag} already exists"
                )

        output_path = Path(os.environ["GITHUB_OUTPUT"])
        with output_path.open("a", encoding="utf-8") as handle:
            handle.write(f"action={action}\n")
            handle.write(f"version={current_version}\n")
            handle.write(f"tag={current_tag}\n")
        print(json.dumps({"action": action, "reason": reason}, indent=2))
        PY

    - name: Skip when already released
      if: steps.classify.outputs.action == 'noop'
      run: echo "Package version already released from an ancestor commit; successful no-op."

    - name: Validate version authorities
      if: steps.classify.outputs.action != 'noop'
      run: |
        python scripts/check_version.py
        uv lock --check

    - name: Build sdist only
      if: steps.classify.outputs.action != 'noop'
      run: |
        rm -rf dist build
        uv build --python 3.11 --sdist --no-sources

    - name: Inspect release sdist
      if: steps.classify.outputs.action != 'noop'
      env:
        EXPECTED_VERSION: ${{ steps.classify.outputs.version }}
      run: |
        python - <<'PY'
        import os
        import tarfile
        from pathlib import Path

        expected_version = os.environ["EXPECTED_VERSION"]
        dist = Path("dist")
        sdists = sorted(dist.glob("*.tar.gz"))
        wheels = sorted(dist.glob("*.whl"))
        if wheels:
            raise SystemExit(f"unexpected wheels in dist: {wheels}")
        if len(sdists) != 1:
            raise SystemExit(f"expected exactly one sdist, found {sdists}")
        sdist = sdists[0]
        with tarfile.open(sdist, "r:gz") as archive:
            names = [member.name for member in archive.getmembers()]
            metadata_name = next(name for name in names if name.endswith("PKG-INFO"))
            metadata = archive.extractfile(metadata_name).read().decode()

        required = (
            "pyproject.toml",
            "setup.py",
            "MANIFEST.in",
            "scripts/build.py",
            "CHANGELOG.md",
            "LICENSE",
            "README.rst",
        )
        for suffix in required:
            if not any(name.endswith(suffix) for name in names):
                raise SystemExit(f"sdist missing {suffix}")
        if not any("src/flake8_custom_import_rules/" in name for name in names):
            raise SystemExit("sdist missing src/flake8_custom_import_rules/")
        if not any(name.endswith("src/flake8_custom_import_rules/py.typed") or name.endswith("flake8_custom_import_rules/py.typed") for name in names):
            raise SystemExit("sdist missing py.typed")

        if f"Version: {expected_version}" not in metadata:
            raise SystemExit(f"sdist Version is not {expected_version}\n{metadata}")
        requires_python = next(
            (line for line in metadata.splitlines() if line.startswith("Requires-Python:")),
            "",
        )
        compact = requires_python.replace(" ", "")
        if ">=3.10" not in compact or "<4" not in compact:
            raise SystemExit(f"sdist Requires-Python mismatch\n{metadata}")
        print("sdist inspection passed:", sdist)
        PY

    - name: Create or verify annotated release tag
      if: steps.classify.outputs.action != 'noop'
      env:
        TAG: ${{ steps.classify.outputs.tag }}
        TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
      run: |
        if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
          TAG_SHA="$(git rev-parse "${TAG}^{}")"
          if [ "${TAG_SHA}" != "${TESTED_SHA}" ]; then
            echo "tag ${TAG} exists at ${TAG_SHA}, not ${TESTED_SHA}"
            exit 1
          fi
          echo "tag ${TAG} already points at tested SHA"
        else
          git tag -a "${TAG}" "${TESTED_SHA}" -m "${TAG}"
          git push origin "refs/tags/${TAG}"
        fi

    - name: Publish sdist to PyPI
      if: steps.classify.outputs.action != 'noop'
      env:
        UV_PUBLISH_USERNAME: ${{ secrets.PYPI_USERNAME }}
        UV_PUBLISH_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        UV_PUBLISH_CHECK_URL: https://pypi.org/simple
      run: uv publish

    - name: Extract changelog section
      if: steps.classify.outputs.action != 'noop'
      id: changelog
      env:
        VERSION: ${{ steps.classify.outputs.version }}
      run: |
        python - <<'PY'
        import os
        import re
        from pathlib import Path

        version = os.environ["VERSION"]
        text = Path("CHANGELOG.md").read_text(encoding="utf-8")
        pattern = rf"(^##\s+v{re.escape(version)}\b.*?)(?=^##\s+v|\Z)"
        match = re.search(pattern, text, re.M | re.S)
        if not match:
            raise SystemExit(f"CHANGELOG.md missing section for v{version}")
        body = match.group(1).strip() + "\n"
        output = Path(os.environ["GITHUB_OUTPUT"])
        with output.open("a", encoding="utf-8") as handle:
            handle.write("body<<CHANGELOG_EOF\n")
            handle.write(body)
            handle.write("CHANGELOG_EOF\n")
        PY

    - name: Create or verify GitHub Release
      if: steps.classify.outputs.action != 'noop'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ steps.classify.outputs.tag }}
        BODY: ${{ steps.changelog.outputs.body }}
      run: |
        if gh release view "${TAG}" >/dev/null 2>&1; then
          echo "GitHub Release ${TAG} already exists; successful rerun."
        else
          printf '%s' "${BODY}" > /tmp/release-body.md
          gh release create "${TAG}" --title "${TAG}" --notes-file /tmp/release-body.md dist/*.tar.gz
        fi
