---
name: Run Unit Tests

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'example_repos/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Makefile'
      - 'pytest.ini'
      - 'setup.cfg'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'example_repos/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Makefile'
      - 'pytest.ini'
      - 'setup.cfg'
      - '.github/workflows/ci.yml'
  workflow_call:

jobs:
  Testing:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
        python-version: ["3.10", "3.11"]
    steps:
      # check-out repo
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.17"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # install requirements (runtime + test group only)
      - name: Install requirements
        run: uv sync --locked --no-default-groups --group test

      # run unit tests
      - name: Run unit-tests
        run: |
          set -o pipefail
          make clean
          make unit-tests-cov-fail UV_TEST_RUN="uv run --locked --no-sync"
          # tox.ini remains deferred to the compatibility migration

      # upload coverage reports to Codecov
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
